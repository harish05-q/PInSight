[project]
name = "pinsight"
version = "0.1.0"
dependencies = [
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
]
description = "Agentic Payment Incident Investigation Platform"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
